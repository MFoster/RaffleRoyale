name: Main CI and non-production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable 40-character Git SHA image tag to deploy
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: non-production
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, test, build, and synth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Synthesize CDK
        run: npm run infra:synth -- --context imageTag=0000000000000000000000000000000000000000

  deploy:
    name: Deploy non-production
    needs: quality
    uses: ./.github/workflows/reusable-aws-nonprod-deploy.yml
    with:
      image_tag: ${{ inputs.image_tag || github.sha }}
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      github_environment: non-production
    secrets: inherit
