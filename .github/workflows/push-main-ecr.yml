name: Main Push CI and ECR Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: push-ecr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish-ecr:
    name: Build and push Docker images to ECR
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'raffle-royale' }}
      WEB_API_PROXY_TARGET: ${{ vars.WEB_API_PROXY_TARGET || '' }}
      ENFORCE_HTTPS: ${{ vars.ENFORCE_HTTPS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate web proxy target
        run: |
          if [ -z "${WEB_API_PROXY_TARGET}" ]; then
            echo "WEB_API_PROXY_TARGET variable is required for production image build."
            exit 1
          fi
          case "${WEB_API_PROXY_TARGET}" in
            http://*|https://*) ;;
            *)
              echo "WEB_API_PROXY_TARGET must be an absolute URL (http:// or https://)."
              exit 1
              ;;
          esac

      - name: Build and push api image
        if: matrix.service == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:main
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:${{ github.run_number }}

      - name: Build and push web image
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          target: prod
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            API_PROXY_TARGET=${{ env.WEB_API_PROXY_TARGET }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:main
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:${{ github.run_number }}

  deploy-ecs:
    name: Deploy API and web to ECS Fargate
    needs: publish-ecr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'raffle-royale' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'raffle-royale' }}
      ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE || 'raffle-royale-api' }}
      ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE || 'raffle-royale-web' }}
      ECS_FRONTEND_URL: ${{ vars.ECS_FRONTEND_URL || '' }}
      WEB_API_PROXY_TARGET: ${{ vars.WEB_API_PROXY_TARGET || '' }}
      ECS_API_UPLOADS_EFS_FILESYSTEM_ID: ${{ vars.ECS_API_UPLOADS_EFS_FILESYSTEM_ID || '' }}
      ECS_API_UPLOADS_EFS_ACCESS_POINT_ID: ${{ vars.ECS_API_UPLOADS_EFS_ACCESS_POINT_ID || '' }}
      ENFORCE_HTTPS: ${{ vars.ENFORCE_HTTPS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.ECS_API_DATABASE_URL }}" ]; then
            echo "ECS_API_DATABASE_URL secret is required for ECS deployment."
            exit 1
          fi
          if [ -z "${{ secrets.ECS_JWT_SECRET }}" ]; then
            echo "ECS_JWT_SECRET secret is required for ECS deployment."
            exit 1
          fi
          if [ -z "${{ secrets.ECS_JWT_REFRESH_SECRET }}" ]; then
            echo "ECS_JWT_REFRESH_SECRET secret is required for ECS deployment."
            exit 1
          fi
          if [ -z "${ECS_FRONTEND_URL}" ]; then
            echo "ECS_FRONTEND_URL variable is required for ECS deployment."
            exit 1
          fi
          if [ -z "${WEB_API_PROXY_TARGET}" ]; then
            echo "WEB_API_PROXY_TARGET variable is required for ECS deployment."
            exit 1
          fi
          case "${WEB_API_PROXY_TARGET}" in
            http://*|https://*) ;;
            *)
              echo "WEB_API_PROXY_TARGET must be an absolute URL (http:// or https://)."
              exit 1
              ;;
          esac
          if [ "${ENFORCE_HTTPS}" = "true" ]; then
            case "${ECS_FRONTEND_URL}" in
              https://*) ;;
              *)
                echo "ECS_FRONTEND_URL must use https:// when ENFORCE_HTTPS=true."
                exit 1
                ;;
            esac
          fi
          if [ -z "${ECS_API_UPLOADS_EFS_FILESYSTEM_ID}" ]; then
            echo "ECS_API_UPLOADS_EFS_FILESYSTEM_ID variable is required for ECS deployment."
            exit 1
          fi
          if [ -z "${ECS_API_UPLOADS_EFS_ACCESS_POINT_ID}" ]; then
            echo "ECS_API_UPLOADS_EFS_ACCESS_POINT_ID variable is required for ECS deployment."
            exit 1
          fi

      - name: Prepare task definition files
        id: taskdef
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          API_TASK_DEF="$RUNNER_TEMP/task-definition-api.json"
          WEB_TASK_DEF="$RUNNER_TEMP/task-definition-web.json"

          sed \
            -e "s/__AWS_ACCOUNT_ID__/${ACCOUNT_ID}/g" \
            -e "s/__AWS_REGION__/${AWS_REGION}/g" \
            -e "s|__FRONTEND_URL__|${ECS_FRONTEND_URL}|g" \
            -e "s/__ECS_API_UPLOADS_EFS_FILESYSTEM_ID__/${ECS_API_UPLOADS_EFS_FILESYSTEM_ID}/g" \
            -e "s/__ECS_API_UPLOADS_EFS_ACCESS_POINT_ID__/${ECS_API_UPLOADS_EFS_ACCESS_POINT_ID}/g" \
            .aws/ecs/task-definition-api.json > "$API_TASK_DEF"

          sed \
            -e "s/__AWS_ACCOUNT_ID__/${ACCOUNT_ID}/g" \
            -e "s/__AWS_REGION__/${AWS_REGION}/g" \
            -e "s|__WEB_API_PROXY_TARGET__|${WEB_API_PROXY_TARGET}|g" \
            .aws/ecs/task-definition-web.json > "$WEB_TASK_DEF"

          echo "api=${API_TASK_DEF}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_TASK_DEF}" >> "$GITHUB_OUTPUT"

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef.outputs.api }}
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-api:${{ github.sha }}
          environment-variables: |
            DATABASE_URL=${{ secrets.ECS_API_DATABASE_URL }}
            JWT_SECRET=${{ secrets.ECS_JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.ECS_JWT_REFRESH_SECRET }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef.outputs.web }}
          container-name: web
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-web:${{ github.sha }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ env.ECS_WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
