services:
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
    volumes:
      - ./apps/jobs/elasticmq.conf:/opt/elasticmq.conf:ro
    command: ["-Dconfig.file=/opt/elasticmq.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9324/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:latest
    ports:
      - "9325:3000"
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
    depends_on:
      elasticmq:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raffle_royale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raffle_royale"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/raffle_royale?schema=public
      UPLOADS_DIRECTORY: /workspace/apps/api/uploads
      PORT: 3001
      FRONTEND_URL: http://localhost:3100
      JWT_SECRET: dev-jwt-secret-change-me
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DRAND_BASE_URL: http://mock-beacon:8088
      DRAND_CHAIN_HASH: b8525930172629e30477e25b56ac4c4a75850cd0b6c150a97d216ec64acb8df6
      DRAND_DRAW_LEAD_SECONDS: 5
    command: >
      sh -c "npm run prisma:generate &&
      npm run prisma:migrate:deploy &&
      npm run start:dev -w api"
    depends_on:
      db:
        condition: service_healthy
      mock-beacon:
        condition: service_healthy
    ports:
      - "3101:3001"
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - api-app-node-modules:/workspace/apps/api/node_modules
      - shared-uploads:/workspace/apps/api/uploads/

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        API_PROXY_TARGET: http://api:3001
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PROXY_TARGET: http://api:3001
    depends_on:
      - api
    ports:
      - "3100:3000"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-next:/workspace/apps/web/.next

  jobs:
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
      target: dev
    entrypoint: ["sh", "-c"]
    command:
      - npm run prisma:generate -w jobs; exec node_modules/.bin/tsx apps/jobs/src/index.ts
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/raffle_royale?schema=public
      UPLOADS_DIRECTORY: /workspace/apps/jobs/uploads
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
      JOBS_SQS_QUEUE_URL: http://elasticmq:9324/000000000000/raffle-royale-jobs
      JOBS_SQS_REPLY_QUEUE_URL: http://elasticmq:9324/000000000000/raffle-royale-jobs-replies
      JOBS_SQS_ENDPOINT_URL: http://elasticmq:9324
      QUEUE_MESSAGE_SIGNING_KEY: dev-shared-queue-signing-key-change-me
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      DRAND_BASE_URL: http://mock-beacon:8088
      DRAND_CHAIN_HASH: b8525930172629e30477e25b56ac4c4a75850cd0b6c150a97d216ec64acb8df6
      DRAND_DRAW_LEAD_SECONDS: 5
    depends_on:
      db:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      mock-beacon:
        condition: service_healthy
    volumes:
      - ./apps/jobs/src:/workspace/apps/jobs/src
      - ./apps/jobs/fixtures:/workspace/apps/jobs/fixtures
      - shared-uploads:/workspace/apps/jobs/uploads

  mock-beacon:
    build:
      context: .
      dockerfile: apps/jobs/Dockerfile
      target: dev
    entrypoint: ["sh", "-c"]
    command:
      - exec node_modules/.bin/tsx packages/raffle-draw/dev/mock-beacon.ts
    environment:
      MOCK_BEACON_PORT: 8088
      DRAND_CHAIN_HASH: b8525930172629e30477e25b56ac4c4a75850cd0b6c150a97d216ec64acb8df6
      MOCK_BEACON_SEED: raffleroyale-dev-beacon-v1
      MOCK_BEACON_PERIOD: 3
      MOCK_BEACON_GENESIS_TIME: 1700000000
    ports:
      - "8088:8088"
    volumes:
      - ./packages/raffle-draw:/workspace/packages/raffle-draw
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:8088/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
      target: dev
    environment:
      SCHEDULER_DB_PATH: /app/data/scheduler.db
      SCHEDULER_SQS_TARGET_QUEUE_URL: http://elasticmq:9324/queue/raffle-events
      SCHEDULER_SQS_ENDPOINT_URL: http://elasticmq:9324
      QUEUE_MESSAGE_SIGNING_KEY: dev-shared-queue-signing-key-change-me
      SCHEDULER_POLL_INTERVAL_MS: 1000
      SCHEDULER_WORKER_ENABLED: "true"
      PORT: 3002
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
    depends_on:
      elasticmq:
        condition: service_healthy
    ports:
      - "3102:3002"
    volumes:
      - .:/workspace
      - scheduler-node-modules:/workspace/node_modules
      - scheduler-app-node-modules:/workspace/apps/scheduler/node_modules
      - ./apps/scheduler/data:/app/data

volumes:
  postgres-data-dev:
  api-node-modules:
  api-app-node-modules:
  web-node-modules:
  web-app-node-modules:
  web-next:
  scheduler-node-modules:
  scheduler-app-node-modules:
  shared-uploads:
